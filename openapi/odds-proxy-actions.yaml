openapi: 3.0.3

info:
  title: SharpBet Odds Proxy
  version: 2.0.0
  description: >
    SharpBet odds gateway for SportsGameOdds, ParlayAPI, The Odds API,
    provider fallback, scores, events, event odds, provider status/history,
    betting logs, and postmortems.

servers:
  - url: https://sports-gpt-gateway.onrender.com
    description: SharpBet Sports GPT Gateway

tags:
  - name: Odds
  - name: Logs
  - name: System

paths:

  /health:
    get:
      operationId: healthCheck
      tags:
        - System
      summary: Check gateway health
      responses:
        '200':
          description: Gateway health
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/odds/status:
    get:
      operationId: getOddsProviderStatus
      tags:
        - Odds
      summary: Get runtime and persistent odds-provider status
      description: >
        Returns current runtime provider state and persistent Supabase usage
        history, including requests, successes, failures, fallbacks, cache hits,
        quota information, last success, and last error.
      responses:
        '200':
          description: Provider status and history
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime:
                    type: object
                    additionalProperties: true
                  history:
                    type: object
                    additionalProperties: true
                additionalProperties: true

  /v1/odds/sports:
    get:
      operationId: listOddsSports
      tags:
        - Odds
      summary: List sports supported by the odds gateway
      description: >
        Uses the gateway's configured sports-provider order.
      parameters:
        - $ref: '#/components/parameters/OddsProvider'

      responses:
        '200':
          description: Sports list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleOddsResponse'

  /v1/odds/{sport}/odds:
    get:
      operationId: getOddsBoard
      tags:
        - Odds
      summary: Get odds board for a sport
      description: >
        Uses the SharpBet gateway fallback chain. By default, the backend
        attempts SportsGameOdds first, then ParlayAPI, then The Odds API
        when available.
      parameters:
        - $ref: '#/components/parameters/SportPath'

        - $ref: '#/components/parameters/OddsProvider'

        - in: query
          name: regions
          required: false
          schema:
            type: string
            default: us

        - in: query
          name: markets
          required: false
          schema:
            type: string
            default: h2h,spreads,totals

        - in: query
          name: oddsFormat
          required: false
          schema:
            type: string
            enum:
              - american
              - decimal
            default: american

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix
            default: iso

        - in: query
          name: bookmakers
          required: false
          schema:
            type: string

        - in: query
          name: commenceTimeFrom
          required: false
          schema:
            type: string

        - in: query
          name: commenceTimeTo
          required: false
          schema:
            type: string

        - in: query
          name: eventIds
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Odds board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleOddsResponse'

        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /v1/odds/{sport}/scores:
    get:
      operationId: getOddsScores
      tags:
        - Odds
      summary: Get live, upcoming, and recent scores
      parameters:
        - $ref: '#/components/parameters/SportPath'

        - $ref: '#/components/parameters/OddsProvider'

        - in: query
          name: daysFrom
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 3

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix
            default: iso

      responses:
        '200':
          description: Scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleOddsResponse'

        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /v1/odds/{sport}/events:
    get:
      operationId: getOddsEvents
      tags:
        - Odds
      summary: Get event list for a sport
      description: >
        Events may include gateway_event_id and provider_event_id fields.
      parameters:
        - $ref: '#/components/parameters/SportPath'

        - $ref: '#/components/parameters/OddsProvider'

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix
            default: iso

        - in: query
          name: commenceTimeFrom
          required: false
          schema:
            type: string

        - in: query
          name: commenceTimeTo
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleOddsResponse'

        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /v1/odds/{sport}/events/{eventId}/odds:
    get:
      operationId: getOddsForEvent
      tags:
        - Odds
      summary: Get odds for one event
      description: >
        Retrieves event-specific odds, props, alternate markets, or other
        provider-supported markets.
      parameters:
        - $ref: '#/components/parameters/SportPath'

        - in: path
          name: eventId
          required: true
          schema:
            type: string

        - $ref: '#/components/parameters/OddsProvider'

        - in: query
          name: regions
          required: false
          schema:
            type: string
            default: us

        - in: query
          name: markets
          required: true
          schema:
            type: string

        - in: query
          name: oddsFormat
          required: false
          schema:
            type: string
            enum:
              - american
              - decimal
            default: american

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix
            default: iso

        - in: query
          name: bookmakers
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Event-specific odds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleOddsResponse'

        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /v1/logs/bet-log:
    get:
      operationId: listBetLogEntries
      tags:
        - Logs
      summary: Get saved betting log entries
      responses:
        '200':
          description: Bet log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BetLogEntry'

    post:
      operationId: createBetLogEntry
      tags:
        - Logs
      summary: Save a betting log entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BetLogEntryInput'

      responses:
        '201':
          description: Bet log entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BetLogEntry'

  /v1/logs/bet-log/{id}:
    patch:
      operationId: updateBetLogEntry
      tags:
        - Logs
      summary: Update a saved betting log entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BetLogEntryUpdate'

      responses:
        '200':
          description: Bet log entry updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BetLogEntry'

        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteBetLogEntry
      tags:
        - Logs
      summary: Delete a saved betting log entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Bet log entry deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted_id:
                    type: string

        '404':
          $ref: '#/components/responses/NotFound'

  /v1/logs/postmortems:
    get:
      operationId: listPostmortems
      tags:
        - Logs
      summary: Get saved betting postmortems
      responses:
        '200':
          description: Postmortems
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Postmortem'

    post:
      operationId: createPostmortem
      tags:
        - Logs
      summary: Save a betting postmortem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostmortemInput'

      responses:
        '201':
          description: Postmortem created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Postmortem'

  /v1/logs/postmortems/{id}:
    patch:
      operationId: updatePostmortem
      tags:
        - Logs
      summary: Update a saved betting postmortem
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostmortemUpdate'

      responses:
        '200':
          description: Postmortem updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Postmortem'

        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deletePostmortem
      tags:
        - Logs
      summary: Delete a saved betting postmortem
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Postmortem deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted_id:
                    type: string

        '404':
          $ref: '#/components/responses/NotFound'

components:

  parameters:

    SportPath:
      in: path
      name: sport
      required: true
      description: >
        Example values: basketball_nba, americanfootball_nfl,
        basketball_ncaab, americanfootball_ncaaf, baseball_mlb,
        icehockey_nhl.
      schema:
        type: string

    OddsProvider:
      in: query
      name: provider
      required: false
      description: >
        Optional provider override. Leave blank to use the normal SharpBet
        provider fallback chain.
      schema:
        type: string
        enum:
          - sportsGameOdds
          - parlayApi
          - theOddsApi
          - oddsApiIo

  responses:

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UpstreamFailure:
      description: Upstream sports or odds provider failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    FlexibleOddsResponse:
      type: object
      properties:
        provider:
          type: string

        data:
          nullable: true

        quota:
          type: object
          nullable: true
          additionalProperties: true

        cache:
          type: object
          properties:
            hit:
              type: boolean
          additionalProperties: true

      additionalProperties: true

    ErrorResponse:
      type: object
      additionalProperties: true

    BetLogEntryInput:
      type: object
      properties:
        date:
          type: string
        sport:
          type: string
        league:
          type: string
        event:
          type: string
        market:
          type: string
        selection:
          type: string
        line:
          nullable: true
        odds:
          type: string
        sportsbook:
          type: string
        stake_usd:
          type: number
          nullable: true
        units:
          type: number
          nullable: true
        is_bonus_bet:
          type: boolean
        boost_used:
          type: boolean
        ev_percent:
          type: number
          nullable: true
        fair_odds:
          nullable: true
        kelly_percent:
          type: number
          nullable: true
        reason:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
        payout_usd:
          type: number
          nullable: true
        closing_line:
          nullable: true
        clv_notes:
          type: string
          nullable: true
        postmortem:
          type: string
          nullable: true

      required:
        - date
        - sport
        - league
        - event
        - market
        - selection
        - odds
        - sportsbook

    BetLogEntryUpdate:
      type: object
      properties:
        closing_line:
          nullable: true
        clv_notes:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
        payout_usd:
          type: number
          nullable: true
        postmortem:
          type: string
          nullable: true
        ev_percent:
          type: number
          nullable: true
        fair_odds:
          nullable: true
        kelly_percent:
          type: number
          nullable: true
        reason:
          type: string
          nullable: true

    BetLogEntry:
      allOf:
        - $ref: '#/components/schemas/BetLogEntryInput'
        - type: object
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time

          required:
            - id
            - created_at

    PostmortemInput:
      type: object
      properties:
        date:
          type: string
        summary:
          type: string
        best_decisions:
          type: array
          items:
            type: string
        worst_decisions:
          type: array
          items:
            type: string
        process_notes:
          type: array
          items:
            type: string
        adjustments:
          type: array
          items:
            type: string

      required:
        - date
        - summary

    PostmortemUpdate:
      type: object
      properties:
        date:
          type: string
        summary:
          type: string
        best_decisions:
          type: array
          items:
            type: string
        worst_decisions:
          type: array
          items:
            type: string
        process_notes:
          type: array
          items:
            type: string
        adjustments:
          type: array
          items:
            type: string

    Postmortem:
      allOf:
        - $ref: '#/components/schemas/PostmortemInput'
        - type: object
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time

          required:
            - id
            - created_at
