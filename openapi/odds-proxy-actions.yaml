openapi: 3.1.0
info:
  title: Sports GPT Odds Proxy
  version: 1.0.0
  description: >
    Proxy action for The Odds API. Your server stores the API key, and the GPT
    calls this proxy instead of calling api.the-odds-api.com directly.
servers:
servers:
  - url: https://sports-gpt-gateway.onrender.com
    description: Deployed Render backend URL
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  odds_api_configured:
                    type: boolean
  /v1/odds/sports:
    get:
      operationId: listOddsSports
      summary: List in-season sports from The Odds API
      parameters:
        - in: query
          name: all
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Sports list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyResponse'
  /v1/odds/{sport}/odds:
    get:
      operationId: getOddsBoard
      summary: Get odds board for a sport
      parameters:
        - in: path
          name: sport
          required: true
          schema:
            type: string
        - in: query
          name: regions
          required: false
          schema:
            type: string
            default: us
        - in: query
          name: markets
          required: false
          schema:
            type: string
            default: h2h,spreads,totals
        - in: query
          name: oddsFormat
          required: false
          schema:
            type: string
            enum: [american, decimal]
            default: american
        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum: [iso, unix]
            default: iso
        - in: query
          name: bookmakers
          required: false
          schema:
            type: string
        - in: query
          name: commenceTimeFrom
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: commenceTimeTo
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: eventIds
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Odds board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyResponse'
  /v1/odds/{sport}/scores:
    get:
      operationId: getOddsScores
      summary: Get live, upcoming, and recent scores for a sport
      parameters:
        - in: path
          name: sport
          required: true
          schema:
            type: string
        - in: query
          name: daysFrom
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 3
        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum: [iso, unix]
            default: iso
      responses:
        '200':
          description: Scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyResponse'
  /v1/odds/{sport}/events:
    get:
      operationId: getOddsEvents
      summary: Get event list for a sport
      parameters:
        - in: path
          name: sport
          required: true
          schema:
            type: string
        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum: [iso, unix]
            default: iso
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyResponse'
  /v1/odds/{sport}/events/{eventId}/odds:
    get:
      operationId: getOddsForEvent
      summary: Get odds for one event, including props or alternate markets
      parameters:
        - in: path
          name: sport
          required: true
          schema:
            type: string
        - in: path
          name: eventId
          required: true
          schema:
            type: string
        - in: query
          name: regions
          required: false
          schema:
            type: string
            default: us
        - in: query
          name: markets
          required: true
          schema:
            type: string
        - in: query
          name: oddsFormat
          required: false
          schema:
            type: string
            enum: [american, decimal]
            default: american
        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum: [iso, unix]
            default: iso
        - in: query
          name: bookmakers
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Single-event odds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyResponse'
                  /v1/logs/bet-log:
    get:
      operationId: listBetLogEntries
      summary: Get saved bet log entries
      responses:
        '200':
          description: Bet log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BetLogEntry'

    post:
      operationId: createBetLogEntry
      summary: Save a bet log entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BetLogEntryInput'
      responses:
        '201':
          description: Saved bet log entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BetLogEntry'

  /v1/logs/bet-log/{id}:
    patch:
      operationId: updateBetLogEntry
      summary: Update a saved bet log entry by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BetLogEntryUpdateInput'
      responses:
        '200':
          description: Bet log entry updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BetLogEntry'

    delete:
      operationId: deleteBetLogEntry
      summary: Delete a saved bet log entry by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bet log entry deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted_id:
                    type: string
                      /v1/logs/postmortems:
    get:
      operationId: listPostmortems
      summary: Get saved postmortem entries
      responses:
        '200':
          description: Postmortem entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Postmortem'

    post:
      operationId: createPostmortem
      summary: Save a betting postmortem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostmortemInput'
      responses:
        '201':
          description: Saved postmortem
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Postmortem'

  /v1/logs/postmortems/{id}:
    patch:
      operationId: updatePostmortem
      summary: Update a saved betting postmortem by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostmortemUpdateInput'
      responses:
        '200':
          description: Postmortem updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Postmortem'

    delete:
      operationId: deletePostmortem
      summary: Delete a saved betting postmortem by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Postmortem deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted_id:
                    type: string
components:
  schemas:
    ProxyResponse:
        BetLogEntryInput:
      type: object
      properties:
        date:
          type: string
        sport:
          type: string
        league:
          type: string
        event:
          type: string
        market:
          type: string
        selection:
          type: string
        line:
          type: string
          nullable: true
        odds:
          type: string
        sportsbook:
          type: string
        stake_usd:
          type: number
          nullable: true
        units:
          type: number
          nullable: true
        is_bonus_bet:
          type: boolean
        boost_used:
          type: boolean
        ev_percent:
          type: number
          nullable: true
        fair_odds:
          type: string
          nullable: true
        kelly_percent:
          type: number
          nullable: true
        reason:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
        payout_usd:
          type: number
          nullable: true
        closing_line:
          type: string
          nullable: true
        clv_notes:
          type: string
          nullable: true
        postmortem:
          type: string
          nullable: true
      required:
        - date
        - sport
        - league
        - event
        - market
        - selection
        - odds
        - sportsbook

    BetLogEntryUpdateInput:
      type: object
      properties:
        closing_line:
          type: string
          nullable: true
        clv_notes:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
        payout_usd:
          type: number
          nullable: true
        postmortem:
          type: string
          nullable: true
        ev_percent:
          type: number
          nullable: true
        fair_odds:
          type: string
          nullable: true
        kelly_percent:
          type: number
          nullable: true
        reason:
          type: string
          nullable: true

    BetLogEntry:
      allOf:
        - $ref: '#/components/schemas/BetLogEntryInput'
        - type: object
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time

    PostmortemInput:
      type: object
      properties:
        date:
          type: string
        summary:
          type: string
        best_decisions:
          type: array
          items:
            type: string
        worst_decisions:
          type: array
          items:
            type: string
        process_notes:
          type: array
          items:
            type: string
        adjustments:
          type: array
          items:
            type: string
      required:
        - date
        - summary

    PostmortemUpdateInput:
      type: object
      properties:
        date:
          type: string
        summary:
          type: string
        best_decisions:
          type: array
          items:
            type: string
        worst_decisions:
          type: array
          items:
            type: string
        process_notes:
          type: array
          items:
            type: string
        adjustments:
          type: array
          items:
            type: string

    Postmortem:
      allOf:
        - $ref: '#/components/schemas/PostmortemInput'
        - type: object
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
      type: object
      properties:
        data:
          oneOf:
            - type: array
              items: {}
            - type: object
              additionalProperties: true
          description: Raw JSON returned by The Odds API
        quota:
          type: object
          properties:
            remaining:
              type: string
              nullable: true
            used:
              type: string
              nullable: true
            last:
              type: string
              nullable: true
