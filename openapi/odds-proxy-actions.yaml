openapi: 3.1.0

info:
  title: SharpBet Odds Proxy
  version: 2.1.0
  description: >
    SharpBet sports odds gateway using SportsGameOdds, ParlayAPI,
    and The Odds API with automatic provider fallback. Also provides
    scores, events, event-specific odds, provider usage/status,
    persistent bet logs, and betting postmortems.

servers:
  - url: https://sports-gpt-gateway.onrender.com

paths:

  /health:
    get:
      operationId: healthCheck
      summary: Check the SharpBet gateway health
      responses:
        "200":
          description: Gateway health information
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  provider_defaults:
                    type: object
                    properties:
                      NBA:
                        type: string
                      NFL:
                        type: string
                      NCAAM:
                        type: string
                      NCAAF:
                        type: string
                      MLB:
                        type: string
                      NHL:
                        type: string
                  odds:
                    type: object
                    properties:
                      defaultOrder:
                        type: array
                        items:
                          type: string
                      sportsOrder:
                        type: array
                        items:
                          type: string
                      providers:
                        type: object
                        properties:
                          sportsGameOdds:
                            $ref: "#/components/schemas/ProviderRuntimeStatus"
                          parlayApi:
                            $ref: "#/components/schemas/ProviderRuntimeStatus"
                          theOddsApi:
                            $ref: "#/components/schemas/ProviderRuntimeStatus"
                          oddsApiIo:
                            $ref: "#/components/schemas/ProviderRuntimeStatus"

  /v1/odds/status:
    get:
      operationId: getOddsProviderStatus
      summary: Get odds provider runtime status and persistent usage history
      description: >
        Returns current provider health plus persistent Supabase history,
        including requests, successes, failures, fallbacks, cache hits,
        quotas, and recent errors.
      responses:
        "200":
          description: Provider runtime and historical usage status
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime:
                    type: object
                    properties:
                      defaultOrder:
                        type: array
                        items:
                          type: string
                      sportsOrder:
                        type: array
                        items:
                          type: string
                      providers:
                        type: object
                        properties:
                          sportsGameOdds:
                            $ref: "#/components/schemas/ProviderRuntimeStatus"
                          parlayApi:
                            $ref: "#/components/schemas/ProviderRuntimeStatus"
                          theOddsApi:
                            $ref: "#/components/schemas/ProviderRuntimeStatus"
                          oddsApiIo:
                            $ref: "#/components/schemas/ProviderRuntimeStatus"
                  history:
                    type: object
                    properties:
                      since:
                        type:
                          - string
                          - "null"
                      total_rows:
                        type: integer
                      providers:
                        type: object
                        properties:
                          sportsGameOdds:
                            $ref: "#/components/schemas/ProviderHistoryStatus"
                          parlayApi:
                            $ref: "#/components/schemas/ProviderHistoryStatus"
                          theOddsApi:
                            $ref: "#/components/schemas/ProviderHistoryStatus"
                          oddsApiIo:
                            $ref: "#/components/schemas/ProviderHistoryStatus"

  /v1/odds/sports:
    get:
      operationId: listOddsSports
      summary: List sports supported by the odds gateway
      parameters:
        - in: query
          name: provider
          required: false
          description: >
            Optional provider override. Leave blank to use the normal
            SharpBet gateway provider order.
          schema:
            type: string
            enum:
              - sportsGameOdds
              - parlayApi
              - theOddsApi
              - oddsApiIo
        - in: query
          name: all
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Supported sports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"

  /v1/odds/{sport}/odds:
    get:
      operationId: getOddsBoard
      summary: Get the current odds board for a sport
      description: >
        Uses the normal SharpBet provider chain unless a provider override
        is supplied. Current default order is SportsGameOdds, then ParlayAPI,
        then The Odds API.
      parameters:
        - in: path
          name: sport
          required: true
          description: >
            Example: basketball_nba, americanfootball_nfl,
            basketball_ncaab, americanfootball_ncaaf,
            baseball_mlb, icehockey_nhl
          schema:
            type: string

        - in: query
          name: provider
          required: false
          schema:
            type: string
            enum:
              - sportsGameOdds
              - parlayApi
              - theOddsApi
              - oddsApiIo

        - in: query
          name: regions
          required: false
          schema:
            type: string
            default: us

        - in: query
          name: markets
          required: false
          description: >
            Comma-separated markets such as h2h, spreads, totals,
            props, or alternate markets.
          schema:
            type: string
            default: h2h,spreads,totals

        - in: query
          name: oddsFormat
          required: false
          schema:
            type: string
            enum:
              - american
              - decimal
            default: american

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix
            default: iso

        - in: query
          name: bookmakers
          required: false
          schema:
            type: string

        - in: query
          name: commenceTimeFrom
          required: false
          schema:
            type: string

        - in: query
          name: commenceTimeTo
          required: false
          schema:
            type: string

        - in: query
          name: eventIds
          required: false
          schema:
            type: string

      responses:
        "200":
          description: Current odds board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"

        "502":
          description: All available upstream odds providers failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/odds/{sport}/scores:
    get:
      operationId: getOddsScores
      summary: Get live, upcoming, and recent scores
      parameters:
        - in: path
          name: sport
          required: true
          schema:
            type: string

        - in: query
          name: provider
          required: false
          schema:
            type: string
            enum:
              - sportsGameOdds
              - parlayApi
              - theOddsApi
              - oddsApiIo

        - in: query
          name: daysFrom
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 3

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix
            default: iso

      responses:
        "200":
          description: Scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"

        "502":
          description: All available upstream providers failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/odds/{sport}/events:
    get:
      operationId: getOddsEvents
      summary: Get the event list for a sport
      description: >
        Returned events may contain gateway_event_id and provider_event_id,
        which can be used for event-specific odds requests.
      parameters:
        - in: path
          name: sport
          required: true
          schema:
            type: string

        - in: query
          name: provider
          required: false
          schema:
            type: string
            enum:
              - sportsGameOdds
              - parlayApi
              - theOddsApi
              - oddsApiIo

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix
            default: iso

        - in: query
          name: commenceTimeFrom
          required: false
          schema:
            type: string

        - in: query
          name: commenceTimeTo
          required: false
          schema:
            type: string

      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"

        "502":
          description: All available upstream providers failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/odds/{sport}/events/{eventId}/odds:
    get:
      operationId: getOddsForEvent
      summary: Get odds for a specific event
      description: >
        Use this for event-specific markets, props, alternate markets,
        and other markets supported by the selected provider.
      parameters:
        - in: path
          name: sport
          required: true
          schema:
            type: string

        - in: path
          name: eventId
          required: true
          description: Provider event ID or gateway_event_id
          schema:
            type: string

        - in: query
          name: provider
          required: false
          schema:
            type: string
            enum:
              - sportsGameOdds
              - parlayApi
              - theOddsApi
              - oddsApiIo

        - in: query
          name: regions
          required: false
          schema:
            type: string
            default: us

        - in: query
          name: markets
          required: true
          schema:
            type: string

        - in: query
          name: oddsFormat
          required: false
          schema:
            type: string
            enum:
              - american
              - decimal
            default: american

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix
            default: iso

        - in: query
          name: bookmakers
          required: false
          schema:
            type: string

      responses:
        "200":
          description: Event-specific odds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"

        "502":
          description: Upstream odds provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/logs/bet-log:
    get:
      operationId: listBetLogEntries
      summary: List saved betting log entries
      responses:
        "200":
          description: Saved betting log
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BetLogEntry"

    post:
      operationId: createBetLogEntry
      summary: Save a new betting log entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetLogEntryInput"
      responses:
        "201":
          description: Saved betting log entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BetLogEntry"

  /v1/logs/bet-log/{id}:
    patch:
      operationId: updateBetLogEntry
      summary: Update a saved betting log entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetLogEntryUpdate"
      responses:
        "200":
          description: Updated betting log entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/BetLogEntry"

    delete:
      operationId: deleteBetLogEntry
      summary: Delete a saved betting log entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted betting log entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted_id:
                    type: string

  /v1/logs/postmortems:
    get:
      operationId: listPostmortems
      summary: List saved betting postmortems
      responses:
        "200":
          description: Saved betting postmortems
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Postmortem"

    post:
      operationId: createPostmortem
      summary: Save a betting postmortem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostmortemInput"
      responses:
        "201":
          description: Saved betting postmortem
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Postmortem"

  /v1/logs/postmortems/{id}:
    patch:
      operationId: updatePostmortem
      summary: Update a saved betting postmortem
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostmortemUpdate"
      responses:
        "200":
          description: Updated betting postmortem
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Postmortem"

    delete:
      operationId: deletePostmortem
      summary: Delete a saved betting postmortem
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted betting postmortem
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted_id:
                    type: string

components:

  schemas:

    ProviderRuntimeStatus:
      type: object
      properties:
        enabled:
          type: boolean
        configured:
          type: boolean
        temporarilyUnavailable:
          type: boolean
        disabledUntil:
          type:
            - string
            - "null"
        exhaustedUntil:
          type:
            - string
            - "null"
        lastSuccessAt:
          type:
            - string
            - "null"
        lastError:
          anyOf:
            - $ref: "#/components/schemas/ProviderError"
            - type: "null"
        lastQuota:
          anyOf:
            - $ref: "#/components/schemas/Quota"
            - type: "null"
        requests:
          type: integer
        successes:
          type: integer
        failures:
          type: integer
        fallbacksTriggered:
          type: integer

    ProviderHistoryStatus:
      type: object
      properties:
        requests:
          type: integer
        successes:
          type: integer
        failures:
          type: integer
        fallbacks:
          type: integer
        cache_hits:
          type: integer
        last_request_at:
          type:
            - string
            - "null"
        last_success_at:
          type:
            - string
            - "null"
        last_failure_at:
          type:
            - string
            - "null"
        last_error:
          type:
            - string
            - "null"
        last_quota:
          anyOf:
            - $ref: "#/components/schemas/Quota"
            - type: "null"

    ProviderError:
      type: object
      properties:
        at:
          type: string
        message:
          type: string
        upstreamStatus:
          type:
            - integer
            - "null"

    Quota:
      type: object
      properties:
        remaining:
          type:
            - string
            - number
            - "null"
        used:
          type:
            - string
            - number
            - "null"
        last:
          type:
            - string
            - number
            - "null"

    GatewayResponse:
      type: object
      properties:
        provider:
          type: string
        data:
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: object
              additionalProperties: true
        quota:
          anyOf:
            - $ref: "#/components/schemas/Quota"
            - type: "null"
        cache:
          type: object
          properties:
            hit:
              type: boolean

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            status:
              type:
                - integer
                - "null"
            details:
              type:
                - object
                - "null"
              additionalProperties: true

    BetLogEntryInput:
      type: object
      properties:
        date:
          type: string
        sport:
          type: string
        league:
          type: string
        event:
          type: string
        market:
          type: string
        selection:
          type: string
        line:
          type:
            - string
            - number
            - "null"
        odds:
          type: string
        sportsbook:
          type: string
        stake_usd:
          type:
            - number
            - "null"
        units:
          type:
            - number
            - "null"
        is_bonus_bet:
          type: boolean
        boost_used:
          type: boolean
        ev_percent:
          type:
            - number
            - "null"
        fair_odds:
          type:
            - string
            - number
            - "null"
        kelly_percent:
          type:
            - number
            - "null"
        reason:
          type:
            - string
            - "null"
        result:
          type:
            - string
            - "null"
        payout_usd:
          type:
            - number
            - "null"
        closing_line:
          type:
            - string
            - number
            - "null"
        clv_notes:
          type:
            - string
            - "null"
        postmortem:
          type:
            - string
            - "null"
      required:
        - date
        - sport
        - league
        - event
        - market
        - selection
        - odds
        - sportsbook

    BetLogEntryUpdate:
      type: object
      properties:
        closing_line:
          type:
            - string
            - number
            - "null"
        clv_notes:
          type:
            - string
            - "null"
        result:
          type:
            - string
            - "null"
        payout_usd:
          type:
            - number
            - "null"
        postmortem:
          type:
            - string
            - "null"
        ev_percent:
          type:
            - number
            - "null"
        fair_odds:
          type:
            - string
            - number
            - "null"
        kelly_percent:
          type:
            - number
            - "null"
        reason:
          type:
            - string
            - "null"

    BetLogEntry:
      allOf:
        - $ref: "#/components/schemas/BetLogEntryInput"
        - type: object
          properties:
            id:
              type: string
            created_at:
              type: string

    PostmortemInput:
      type: object
      properties:
        date:
          type: string
        summary:
          type: string
        best_decisions:
          type: array
          items:
            type: string
        worst_decisions:
          type: array
          items:
            type: string
        process_notes:
          type: array
          items:
            type: string
        adjustments:
          type: array
          items:
            type: string
      required:
        - date
        - summary

    PostmortemUpdate:
      type: object
      properties:
        date:
          type: string
        summary:
          type: string
        best_decisions:
          type: array
          items:
            type: string
        worst_decisions:
          type: array
          items:
            type: string
        process_notes:
          type: array
          items:
            type: string
        adjustments:
          type: array
          items:
            type: string

    Postmortem:
      allOf:
        - $ref: "#/components/schemas/PostmortemInput"
        - type: object
          properties:
            id:
              type: string
            created_at:
              type: string
