                properties:
                  success:
                    type: boolean
                  data: *id001
                required:
                - success
                - data
    delete:
      operationId: deletePromo
      summary: Delete a saved promo
      description: Permanently deletes a promo inventory entry by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Promo deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted_id:
                    type: string
                required:
                - success
                - deleted_id
components:
  schemas:
    League:
      type: object
      properties:
        code:
          type: string
          enum:
          - NBA
          - NFL
          - NCAAM
          - NCAAF
          - MLB
          - NHL
        name:
          type: string
        season_type:
          type: string
        notes:
          type: string
      required:
      - code
      - name
      additionalProperties: true
    GatewayResponse:
      type: object
      properties:
        provider:
          type: string
        data:
          oneOf:
          - type: array
            items:
              type: object
              properties:
                id:
                  type: string
              additionalProperties: true
          - type: object
            properties:
              id:
                type: string
            additionalProperties: true
          - type: 'null'
        quota:
          oneOf:
          - type: object
            properties:
              remaining:
                type:
                - string
                - number
                - 'null'
              used:
                type:
                - string
                - number
                - 'null'
              last:
                type:
                - string
                - number
                - 'null'
            additionalProperties: true
          - type: 'null'
        cache:
          type: object
          properties:
            hit:
              type: boolean
          additionalProperties: true
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            status:
              type:
              - integer
              - 'null'
            details:
              oneOf:
              - type: object
                properties:
                  message:
                    type: string
                additionalProperties: true
              - type: 'null'
          required:
          - message
          additionalProperties: true
      required:
      - error
      additionalProperties: true
    BetLogEntryInput:
      type: object
      properties:
        date:
          type: string
        sport:
          type: string
        league:
          type: string
        event:
          type: string
        market:
          type: string
        selection:
          type: string
        line:
          type:
          - string
          - number
          - 'null'
        odds:
          type: string
        sportsbook:
          type: string
        gateway_event_id:
          type:
          - string
          - 'null'
          description: 'Stable SharpBet gateway event identifier used to re-query the same event for CLV
            and market tracking.

            '
        provider_event_id:
          type:
          - string
          - 'null'
          description: 'Native upstream odds-provider event identifier when available.

            '
        sport_key:
          type:
          - string
          - 'null'
          description: 'Normalized odds sport key such as americanfootball_nfl, basketball_nba, baseball_mlb,
            or icehockey_nhl.

            '
        market_key:
          type:
          - string
          - 'null'
          description: 'Normalized odds-market key such as h2h, spreads, totals, player_points, or other
