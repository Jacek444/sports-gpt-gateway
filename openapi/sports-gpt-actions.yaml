openapi: 3.1.0
info:
  title: SharpBet Sports GPT Gateway
  version: 2.11.1
  description: Unified SharpBet sports data gateway for NBA, NFL, NCAAM, NCAAF, MLB, and NHL. Uses the
    SharpBet odds-provider chain with SportsGameOdds, ParlayAPI, and The Odds API, with optional OddsApiIo
    provider support. Includes odds, scores, events, event-specific odds, provider status, persistent
    provider usage history, paginated betting logs, recommendation snapshots, structured handicap tags,
    CLV tracking, event/market identifiers, compact CLV lookup, local CLV tracking from historical closing
    odds, and postmortems. Adds persistent promo inventory with create, list/filter, update-status, and
    delete operations.
servers:
- url: https://sports-gpt-gateway.onrender.com
  description: SharpBet Sports GPT Gateway on Render
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check the SharpBet gateway health
      responses:
        '200':
          description: Gateway health information
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  provider_defaults:
                    type: object
                    properties:
                      NBA:
                        type: string
                      NFL:
                        type: string
                      NCAAM:
                        type: string
                      NCAAF:
                        type: string
                      MLB:
                        type: string
                      NHL:
                        type: string
                    additionalProperties: true
                  odds:
                    type: object
                    properties:
                      defaultOrder:
                        type: array
                        items:
                          type: string
                      sportsOrder:
                        type: array
                        items:
                          type: string
                      providers:
                        type: object
                        properties:
                          sportsGameOdds:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                          parlayApi:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                          theOddsApi:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                          oddsApiIo:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                        additionalProperties: true
                    additionalProperties: true
                additionalProperties: true
  /v1/leagues:
    get:
      operationId: listLeagues
      summary: List supported sports leagues
      responses:
        '200':
          description: Supported leagues
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/League'
                additionalProperties: true
  /v1/games:
    get:
      operationId: listGames
      summary: List games for a league
      parameters:
      - in: query
        name: league
        required: true
        schema:
          type: string
          enum:
          - NBA
          - NFL
          - NCAAM
          - NCAAF
          - MLB
          - NHL
      - in: query
        name: date
        required: false
        description: Game date in YYYY-MM-DD format
        schema:
          type: string
          format: date
      - in: query
        name: season
        required: false
        schema:
          type: integer
      - in: query
        name: week
        required: false
        description: Primarily used for NFL and NCAAF
        schema:
          type: integer
      - in: query
        name: team
        required: false
        description: Team abbreviation, name, or provider team ID
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - scheduled
          - live
          - final
          - postponed
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Games
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        league:
                          type: string
                        status:
                          type: string
                        start_time:
                          type: string
                        home_team:
                          type: string
                        away_team:
                          type: string
                      additionalProperties: true
                  cursor:
                    type:
                    - string
                    - 'null'
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/games/{league}/{gameId}:
    get:
      operationId: getGame
      summary: Get a specific game
      parameters:
      - in: path
        name: league
        required: true
        schema:
          type: string
          enum:
          - NBA
          - NFL
          - NCAAM
          - NCAAF
          - MLB
          - NHL
      - in: path
        name: gameId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Game detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  league:
                    type: string
                  status:
                    type: string
                  start_time:
                    type: string
                  home_team:
                    type: string
                  away_team:
                    type: string
                  data:
                    oneOf:
                    - type: object
                      properties:
                        id:
                          type: string
                      additionalProperties: true
                    - type: 'null'
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Game not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/teams:
    get:
      operationId: listTeams
      summary: List teams for a league
      parameters:
      - in: query
        name: league
        required: true
        schema:
          type: string
          enum:
          - NBA
          - NFL
          - NCAAM
          - NCAAF
          - MLB
          - NHL
      - in: query
        name: search
        required: false
        description: Team name, city, college, or abbreviation
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        abbreviation:
                          type: string
                      additionalProperties: true
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/standings:
    get:
      operationId: listStandings
      summary: Get standings for a league and season
      parameters:
      - in: query
        name: league
        required: true
        schema:
          type: string
          enum:
          - NBA
          - NFL
          - NCAAM
          - NCAAF
          - MLB
          - NHL
      - in: query
        name: season
        required: false
        schema:
          type: integer
      - in: query
        name: conference
        required: false
        schema:
          type: string
      - in: query
        name: division
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Standings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        team:
                          type: string
                        wins:
                          type: integer
                        losses:
                          type: integer
                      additionalProperties: true
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/odds/status:
    get:
      operationId: getOddsProviderStatus
      summary: Get odds provider runtime status and persistent usage history
      description: 'Returns current provider health plus persistent Supabase history, including requests,
        successes, failures, fallbacks, cache hits, quotas, and recent errors.

        '
      responses:
        '200':
          description: Odds provider status and usage history
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime:
                    type: object
                    properties:
                      defaultOrder:
                        type: array
                        items:
                          type: string
                      sportsOrder:
                        type: array
                        items:
                          type: string
                      providers:
                        type: object
                        properties:
                          sportsGameOdds:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                          parlayApi:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                          theOddsApi:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                          oddsApiIo:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                        additionalProperties: true
                    additionalProperties: true
                  history:
                    type: object
                    properties:
                      since:
                        type:
                        - string
                        - 'null'
                      total_rows:
                        type: integer
                      providers:
                        type: object
                        properties:
                          sportsGameOdds:
                            type: object
                            properties:
                              requests:
                                type: integer
                            additionalProperties: true
                          parlayApi:
                            type: object
                            properties:
                              requests:
                                type: integer
                            additionalProperties: true
                          theOddsApi:
                            type: object
                            properties:
                              requests:
                                type: integer
                            additionalProperties: true
                          oddsApiIo:
                            type: object
                            properties:
                              requests:
                                type: integer
                            additionalProperties: true
                        additionalProperties: true
                    additionalProperties: true
                additionalProperties: true
  /v1/odds/sports:
    get:
      operationId: listOddsSports
      summary: List sports supported by the odds gateway
      description: 'Uses the normal SharpBet provider chain unless a provider override is supplied.

        '
      parameters:
      - in: query
        name: provider
        required: false
        description: 'Optional provider override. Leave blank to use the normal SharpBet gateway provider
          order.

          '
        schema:
          type: string
          enum:
          - sportsGameOdds
          - parlayApi
          - theOddsApi
          - oddsApiIo
          - sharpApi
          - oddsPapi
          - moneyline
      - in: query
        name: all
        required: false
        description: Include all supported sports when available
        schema:
          type: boolean
      responses:
        '200':
          description: Supported sports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'
  /v1/odds/{sport}/odds:
    get:
      operationId: getOddsBoard
      summary: Get the current odds board for a sport
      description: 'Uses the normal SharpBet provider chain unless a provider override is supplied. Current
        default order is SharpAPI, OddsPapi, SportsGameOdds, ParlayAPI, then The Odds API.

        '
      parameters:
      - in: path
        name: sport
        required: true
        description: 'Example: basketball_nba, americanfootball_nfl, basketball_ncaab, americanfootball_ncaaf,
          baseball_mlb, icehockey_nhl

          '
        schema:
          type: string
      - in: query
        name: provider
        required: false
        schema:
          type: string
          enum:
          - sportsGameOdds
          - parlayApi
          - theOddsApi
          - oddsApiIo
          - sharpApi
          - oddsPapi
          - moneyline
      - in: query
        name: regions
        required: false
        schema:
          type: string
          default: us
      - in: query
        name: markets
        required: false
        description: 'Comma-separated markets such as h2h, spreads, totals, props, or alternate markets.

          '
        schema:
          type: string
          default: h2h,spreads,totals
      - in: query
        name: oddsFormat
        required: false
        schema:
          type: string
          enum:
          - american
          - decimal
          default: american
      - in: query
        name: dateFormat
        required: false
        schema:
          type: string
          enum:
          - iso
          - unix
          default: iso
      - in: query
        name: bookmakers
        required: false
        description: Comma-separated sportsbook or bookmaker filter
        schema:
          type: string
      - in: query
        name: commenceTimeFrom
        required: false
        schema:
          type: string
      - in: query
        name: commenceTimeTo
        required: false
        schema:
          type: string
      - in: query
        name: eventIds
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Current odds board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'
        '502':
          description: All available upstream odds providers failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/odds/{sport}/scores:
    get:
      operationId: getOddsScores
      summary: Get live, upcoming, and recent scores
      parameters:
      - in: path
        name: sport
        required: true
        schema:
          type: string
      - in: query
        name: provider
        required: false
        schema:
          type: string
          enum:
          - sportsGameOdds
          - parlayApi
          - theOddsApi
          - oddsApiIo
          - sharpApi
          - oddsPapi
          - moneyline
      - in: query
        name: daysFrom
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 3
      - in: query
        name: dateFormat
        required: false
        schema:
          type: string
          enum:
          - iso
          - unix
          default: iso
      responses:
        '200':
          description: Scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'
        '502':
          description: All available upstream providers failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/odds/{sport}/events:
    get:
      operationId: getOddsEvents
      summary: Get the event list for a sport
      description: 'Returned events may contain gateway_event_id and provider_event_id, which can be used
        for event-specific odds requests.

        '
      parameters:
      - in: path
        name: sport
        required: true
        schema:
          type: string
      - in: query
        name: provider
        required: false
        schema:
          type: string
          enum:
          - sportsGameOdds
          - parlayApi
          - theOddsApi
          - oddsApiIo
          - sharpApi
          - oddsPapi
          - moneyline
      - in: query
        name: dateFormat
        required: false
        schema:
          type: string
          enum:
          - iso
          - unix
          default: iso
      - in: query
        name: commenceTimeFrom
        required: false
        schema:
          type: string
      - in: query
        name: commenceTimeTo
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'
        '502':
          description: All available upstream providers failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/odds/clv/grade-and-save:
    post:
      operationId: gradeAndSaveClv
      summary: Grade logged bets for CLV from historical closing odds and optionally save the results
      description: Grades up to 50 logged bets using ParlayAPI historical closing odds, matches the correct
        event and wager side, calculates local CLV, and can write closing_line, closing_odds, closing_book,
        clv_percent, clv_status, and clv_notes back to the bet log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                write_back:
                  type: boolean
                  default: true
                  description: When true, every wager must include bet_id and the calculated CLV result
                    is saved into that bet-log row.
                bets:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      bet_id:
                        type:
                        - string
                        - 'null'
                      sport_key:
                        type:
                        - string
                        - 'null'
                        description: Normalized odds sport key when known.
                      sport:
                        type:
                        - string
                        - 'null'
                        description: Fallback sport label such as NFL, NBA, MLB, NHL, NCAAM, or NCAAF.
                      league:
                        type:
                        - string
                        - 'null'
                        description: Fallback league label used to derive sport_key when sport_key is
                          missing.
                      player:
                        type:
                        - string
                        - 'null'
                      market:
                        type:
                        - string
                        - 'null'
                      market_key:
                        type:
                        - string
                        - 'null'
                      line:
                        type:
                        - string
                        - number
                        - 'null'
                      outcome:
                        type:
                        - string
                        - 'null'
                      outcome_key:
                        type:
                        - string
                        - 'null'
                      selection:
                        type:
                        - string
                        - 'null'
                      taken_odds:
                        type:
                        - string
                        - number
                        - 'null'
                      odds:
                        type:
                        - string
                        - number
                        - 'null'
                      sportsbook:
                        type:
                        - string
                        - 'null'
                      bookmaker:
                        type:
                        - string
                        - 'null'
                      bookmaker_key:
                        type:
                        - string
                        - 'null'
                      event:
                        type:
                        - string
                        - 'null'
                        description: Event text such as 'Away @ Home' or 'Team A vs Team B'. Used to infer
                          teams when home_team and away_team are not supplied.
                      home_team:
                        type:
                        - string
                        - 'null'
                      away_team:
                        type:
                        - string
                        - 'null'
                      game_date:
                        type:
                        - string
                        - 'null'
                        format: date
                      date:
                        type:
                        - string
                        - 'null'
                        format: date
                      commence_time:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Preferred date source. The gateway derives the UTC archive date from
                          commence_time when available.
                    additionalProperties: true
              required:
              - bets
              additionalProperties: false
      responses:
        '200':
          description: Local CLV grading and optional bet-log write-back result
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                  method:
                    type: string
                  write_back:
                    type: boolean
                  submitted:
                    type: integer
                  group_count:
                    type: integer
                  max_groups:
                    type: integer
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        sport:
                          type: string
                        date:
                          type: string
                        market:
                          type: string
                        player:
                          type:
                          - string
                          - 'null'
                        bet_count:
                          type: integer
                        source_row_count:
                          type: integer
                        cache_hit:
                          type: boolean
                        quota:
                          oneOf:
                          - type: object
                            additionalProperties: true
                          - type: 'null'
                      additionalProperties: true
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        bet_index:
                          type: integer
                        bet_id:
                          type:
                          - string
                          - 'null'
                        sport_key:
                          type:
                          - string
                          - 'null'
                        game_date:
                          type:
                          - string
                          - 'null'
                        market:
                          type:
                          - string
                          - 'null'
                        outcome:
                          type:
                          - string
                          - 'null'
                        bookmaker:
                          type:
                          - string
                          - 'null'
                        match_status:
                          type: string
                        closing_match:
                          oneOf:
                          - type: object
                            properties:
                              line:
                                type:
                                - number
                                - 'null'
                              odds:
                                type:
                                - number
                                - 'null'
                              bookmaker:
                                type:
                                - string
                                - 'null'
                              source:
                                type:
                                - string
                                - 'null'
                              contributing_books:
                                type:
                                - integer
                                - 'null'
                            additionalProperties: true
                          - type: 'null'
                        log_update:
                          type: object
                          properties:
                            closing_line:
                              type:
                              - string
                              - number
                              - 'null'
                            closing_odds:
                              type:
                              - string
                              - 'null'
                            closing_book:
                              type:
                              - string
                              - 'null'
                            clv_percent:
                              type:
                              - number
                              - 'null'
                            clv_status:
                              type:
                              - string
                              - 'null'
                            clv_notes:
                              type:
                              - string
                              - 'null'
                          additionalProperties: true
                        saved:
                          type: boolean
                        saved_entry:
                          oneOf:
                          - $ref: '#/components/schemas/BetLogEntry'
                          - type: 'null'
                      additionalProperties: true
                additionalProperties: true
        '400':
          description: Invalid CLV batch, missing matching fields, or too many historical groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: ParlayAPI historical closing-line request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/odds/{sport}/clv-lookup:
    get:
      operationId: getClvLookup
      summary: Get a compact historical closing-line lookup for CLV analysis
      description: 'Retrieves ParlayAPI historical closing odds and returns only rows matching the supplied
        event, market, book, and optional player filters. This keeps large historical responses compact
        for GPT use.

        '
      parameters:
      - in: path
        name: sport
        required: true
        description: 'Normalized sport key such as americanfootball_nfl, basketball_nba, basketball_ncaab,
          americanfootball_ncaaf, baseball_mlb, or icehockey_nhl.

          '
        schema:
          type: string
      - in: query
        name: date
        required: false
        description: 'Closing-line date in YYYY-MM-DD format. Optional when commence_time is supplied.

          '
        schema:
          type: string
          format: date
      - in: query
        name: commence_time
        required: false
        description: 'Event start time. When supplied, the gateway derives the UTC archive date from this
          timestamp and prefers it over date.

          '
        schema:
          type: string
          format: date-time
      - in: query
        name: home_team
        required: false
        description: Home team name used to match the historical event
        schema:
          type: string
      - in: query
        name: away_team
        required: false
        description: Away team name used to match the historical event
        schema:
          type: string
      - in: query
        name: market
        required: true
        description: 'Market key such as h2h, spreads, totals, or a supported player-prop market.

          '
        schema:
          type: string
      - in: query
        name: bookmaker
        required: false
        description: 'Optional sportsbook or bookmaker filter.

          '
        schema:
          type: string
      - in: query
        name: player
        required: false
        description: 'Optional player name for player-prop closing-line lookups.

          '
        schema:
          type: string
      - in: query
        name: limit
        required: false
        description: Maximum number of matched closing rows to return
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Compact matched closing-line rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                  filters:
                    type: object
                    properties:
                      sport:
                        type: string
                      archive_date:
                        type: string
                      supplied_date:
                        type:
                        - string
                        - 'null'
                      commence_time:
                        type:
                        - string
                        - 'null'
                      date_source:
                        type: string
                      home_team:
                        type:
                        - string
                        - 'null'
                      away_team:
                        type:
                        - string
                        - 'null'
                      market:
                        type: string
                      bookmaker:
                        type:
                        - string
                        - 'null'
                      player:
                        type:
                        - string
                        - 'null'
                      limit:
                        type: integer
                    additionalProperties: true
                  source_row_count:
                    type: integer
                  matched_count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        canonical_event_id:
                          type:
                          - string
                          - number
                          - 'null'
                        home_team:
                          type:
                          - string
                          - 'null'
