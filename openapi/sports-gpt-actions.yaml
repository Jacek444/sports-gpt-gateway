  /v1/odds/{sport}/closing-odds:
    get:
      operationId: getClosingOdds
      summary: Get historical closing odds from ParlayAPI
      description: 'Retrieves final pregame closing prices for CLV analysis. This endpoint intentionally
        uses ParlayAPI so closing-line lookups do not consume the primary SportsGameOdds workflow.

        '
      parameters:
      - in: path
        name: sport
        required: true
        description: 'Normalized sport key such as americanfootball_nfl, basketball_nba, basketball_ncaab,
          americanfootball_ncaaf, baseball_mlb, or icehockey_nhl.

          '
        schema:
          type: string
      - in: query
        name: date
        required: false
        description: Closing-line date in YYYY-MM-DD format
        schema:
          type: string
          format: date
      - in: query
        name: event_id
        required: false
        description: 'ParlayAPI event identifier used to restrict the closing-line response to a single
          event.

          '
        schema:
          type: string
      - in: query
        name: markets
        required: false
        description: 'Comma-separated markets such as h2h, spreads, totals, or other closing markets supported
          by ParlayAPI.

          '
        schema:
          type: string
      - in: query
        name: bookmakers
        required: false
        description: 'Optional comma-separated sportsbook or bookmaker filter.

          '
        schema:
          type: string
      responses:
        '200':
          description: Historical closing odds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: ParlayAPI closing-line request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/odds/{sport}/events/{eventId}/odds:
    get:
      operationId: getOddsForEvent
      summary: Get odds for a specific event
      description: 'Use this for event-specific markets, props, alternate markets, and other markets supported
        by the selected provider.

        '
      parameters:
      - in: path
        name: sport
        required: true
        schema:
          type: string
      - in: path
        name: eventId
        required: true
        description: Provider event ID or gateway_event_id
        schema:
          type: string
      - in: query
        name: provider
        required: false
        schema:
          type: string
          enum:
          - sportsGameOdds
          - parlayApi
          - theOddsApi
          - oddsApiIo
          - sharpApi
          - oddsPapi
          - moneyline
      - in: query
        name: regions
        required: false
        schema:
          type: string
          default: us
      - in: query
        name: markets
        required: true
        description: 'Market or comma-separated markets such as h2h, spreads, totals, player props, or
          alternate lines.

          '
        schema:
          type: string
      - in: query
        name: oddsFormat
        required: false
        schema:
          type: string
          enum:
          - american
          - decimal
          default: american
      - in: query
        name: dateFormat
        required: false
        schema:
          type: string
          enum:
          - iso
          - unix
          default: iso
      - in: query
        name: bookmakers
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Event-specific odds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'
        '502':
          description: Upstream odds provider failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/logs/bet-log:
    get:
      operationId: listBetLogEntries
      summary: List saved betting log entries
      description: 'Returns saved betting log entries with pagination and optional filters. Use limit
        and offset to safely retrieve large betting histories in chunks.

        '
      parameters:
      - in: query
        name: limit
        required: false
        description: Maximum number of betting log entries to return
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: offset
        required: false
        description: Number of betting log entries to skip
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: start_date
        required: false
        description: Only return bets on or after this date
        schema:
          type: string
          format: date
      - in: query
        name: end_date
        required: false
        description: Only return bets on or before this date
        schema:
          type: string
          format: date
      - in: query
        name: sport
        required: false
        description: Filter betting log entries by sport
        schema:
          type: string
      - in: query
        name: result
        required: false
        description: 'Filter by bet result, such as win, loss, push, pending, void, or cashout.

          '
        schema:
          type: string
      responses:
        '200':
          description: Saved betting log
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BetLogEntry'
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      returned:
                        type: integer
                    additionalProperties: true
                additionalProperties: true
    post:
      operationId: createBetLogEntry
      summary: Save a new betting log entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BetLogEntryInput'
      responses:
        '201':
          description: Saved betting log entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BetLogEntry'
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/logs/bet-log/{id}:
    patch:
      operationId: updateBetLogEntry
