          type:
          - string
          - 'null'
          description: 'Normalized sportsbook or bookmaker identifier when available.

            '
        odds_provider:
          type:
          - string
          - 'null'
          description: 'Odds provider that supplied the original market or event data.

            '
        commence_time:
          type:
          - string
          - 'null'
