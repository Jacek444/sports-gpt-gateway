openapi: 3.1.0

info:
  title: SharpBet Sports GPT Gateway
  version: 2.5.0
  description: >
    Unified SharpBet sports data gateway for NBA, NFL, NCAAM, NCAAF, MLB,
    and NHL. Uses the SharpBet odds-provider chain with SportsGameOdds,
    ParlayAPI, and The Odds API, with optional OddsApiIo provider support.
    Includes odds, scores, events, event-specific odds, provider status,
    persistent provider usage history, paginated betting logs,
    recommendation snapshots, structured handicap tags, CLV tracking,
    event/market identifiers, ParlayAPI CLV history grading, and postmortems.

servers:
  - url: https://sports-gpt-gateway.onrender.com
    description: SharpBet Sports GPT Gateway on Render

paths:

  /health:
    get:
      operationId: healthCheck
      summary: Check the SharpBet gateway health
      responses:
        "200":
          description: Gateway health information
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  provider_defaults:
                    type: object
                    properties:
                      NBA:
                        type: string
                      NFL:
                        type: string
                      NCAAM:
                        type: string
                      NCAAF:
                        type: string
                      MLB:
                        type: string
                      NHL:
                        type: string
                    additionalProperties: true
                  odds:
                    type: object
                    properties:
                      defaultOrder:
                        type: array
                        items:
                          type: string
                      sportsOrder:
                        type: array
                        items:
                          type: string
                      providers:
                        type: object
                        properties:
                          sportsGameOdds:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                          parlayApi:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                          theOddsApi:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                          oddsApiIo:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                        additionalProperties: true
                    additionalProperties: true
                additionalProperties: true

  /v1/leagues:
    get:
      operationId: listLeagues
      summary: List supported sports leagues
      responses:
        "200":
          description: Supported leagues
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/League"
                additionalProperties: true

  /v1/games:
    get:
      operationId: listGames
      summary: List games for a league
      parameters:
        - in: query
          name: league
          required: true
          schema:
            type: string
            enum:
              - NBA
              - NFL
              - NCAAM
              - NCAAF
              - MLB
              - NHL

        - in: query
          name: date
          required: false
          description: Game date in YYYY-MM-DD format
          schema:
            type: string
            format: date

        - in: query
          name: season
          required: false
          schema:
            type: integer

        - in: query
          name: week
          required: false
          description: Primarily used for NFL and NCAAF
          schema:
            type: integer

        - in: query
          name: team
          required: false
          description: Team abbreviation, name, or provider team ID
          schema:
            type: string

        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - scheduled
              - live
              - final
              - postponed

        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25

        - in: query
          name: cursor
          required: false
          schema:
            type: string

      responses:
        "200":
          description: Games
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        league:
                          type: string
                        status:
                          type: string
                        start_time:
                          type: string
                        home_team:
                          type: string
                        away_team:
                          type: string
                      additionalProperties: true
                  cursor:
                    type:
                      - string
                      - "null"
                additionalProperties: true

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/games/{league}/{gameId}:
    get:
      operationId: getGame
      summary: Get a specific game
      parameters:
        - in: path
          name: league
          required: true
          schema:
            type: string
            enum:
              - NBA
              - NFL
              - NCAAM
              - NCAAF
              - MLB
              - NHL

        - in: path
          name: gameId
          required: true
          schema:
            type: string

      responses:
        "200":
          description: Game detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  league:
                    type: string
                  status:
                    type: string
                  start_time:
                    type: string
                  home_team:
                    type: string
                  away_team:
                    type: string
                  data:
                    oneOf:
                      - type: object
                        properties:
                          id:
                            type: string
                        additionalProperties: true
                      - type: "null"
                additionalProperties: true

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/teams:
    get:
      operationId: listTeams
      summary: List teams for a league
      parameters:
        - in: query
          name: league
          required: true
          schema:
            type: string
            enum:
              - NBA
              - NFL
              - NCAAM
              - NCAAF
              - MLB
              - NHL

        - in: query
          name: search
          required: false
          description: Team name, city, college, or abbreviation
          schema:
            type: string

        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50

      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        abbreviation:
                          type: string
                      additionalProperties: true
                additionalProperties: true

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/standings:
    get:
      operationId: listStandings
      summary: Get standings for a league and season
      parameters:
        - in: query
          name: league
          required: true
          schema:
            type: string
            enum:
              - NBA
              - NFL
              - NCAAM
              - NCAAF
              - MLB
              - NHL

        - in: query
          name: season
          required: false
          schema:
            type: integer

        - in: query
          name: conference
          required: false
          schema:
            type: string

        - in: query
          name: division
          required: false
          schema:
            type: string

      responses:
        "200":
          description: Standings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        team:
                          type: string
                        wins:
                          type: integer
                        losses:
                          type: integer
                      additionalProperties: true
                additionalProperties: true

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/odds/status:
    get:
      operationId: getOddsProviderStatus
      summary: Get odds provider runtime status and persistent usage history
      description: >
        Returns current provider health plus persistent Supabase history,
        including requests, successes, failures, fallbacks, cache hits,
        quotas, and recent errors.
      responses:
        "200":
          description: Odds provider status and usage history
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime:
                    type: object
                    properties:
                      defaultOrder:
                        type: array
                        items:
                          type: string
                      sportsOrder:
                        type: array
                        items:
                          type: string
                      providers:
                        type: object
                        properties:
                          sportsGameOdds:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                          parlayApi:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                          theOddsApi:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                          oddsApiIo:
                            type: object
                            properties:
                              status:
                                type: string
                            additionalProperties: true
                        additionalProperties: true
                    additionalProperties: true

                  history:
                    type: object
                    properties:
                      since:
                        type:
                          - string
                          - "null"
                      total_rows:
                        type: integer
                      providers:
                        type: object
                        properties:
                          sportsGameOdds:
                            type: object
                            properties:
                              requests:
                                type: integer
                            additionalProperties: true
                          parlayApi:
                            type: object
                            properties:
                              requests:
                                type: integer
                            additionalProperties: true
                          theOddsApi:
                            type: object
                            properties:
                              requests:
                                type: integer
                            additionalProperties: true
                          oddsApiIo:
                            type: object
                            properties:
                              requests:
                                type: integer
                            additionalProperties: true
                        additionalProperties: true
                    additionalProperties: true

                additionalProperties: true

  /v1/odds/sports:
    get:
      operationId: listOddsSports
      summary: List sports supported by the odds gateway
      description: >
        Uses the normal SharpBet provider chain unless a provider override
        is supplied.
      parameters:
        - in: query
          name: provider
          required: false
          description: >
            Optional provider override. Leave blank to use the normal
            SharpBet gateway provider order.
          schema:
            type: string
            enum:
              - sportsGameOdds
              - parlayApi
              - theOddsApi
              - oddsApiIo

        - in: query
          name: all
          required: false
          description: Include all supported sports when available
          schema:
            type: boolean

      responses:
        "200":
          description: Supported sports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"

  /v1/odds/{sport}/odds:
    get:
      operationId: getOddsBoard
      summary: Get the current odds board for a sport
      description: >
        Uses the normal SharpBet provider chain unless a provider override
        is supplied. Current default order is SportsGameOdds, then ParlayAPI,
        then The Odds API.
      parameters:
        - in: path
          name: sport
          required: true
          description: >
            Example: basketball_nba, americanfootball_nfl,
            basketball_ncaab, americanfootball_ncaaf,
            baseball_mlb, icehockey_nhl
          schema:
            type: string

        - in: query
          name: provider
          required: false
          schema:
            type: string
            enum:
              - sportsGameOdds
              - parlayApi
              - theOddsApi
              - oddsApiIo

        - in: query
          name: regions
          required: false
          schema:
            type: string
            default: us

        - in: query
          name: markets
          required: false
          description: >
            Comma-separated markets such as h2h, spreads, totals,
            props, or alternate markets.
          schema:
            type: string
            default: h2h,spreads,totals

        - in: query
          name: oddsFormat
          required: false
          schema:
            type: string
            enum:
              - american
              - decimal
            default: american

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix
            default: iso

        - in: query
          name: bookmakers
          required: false
          description: Comma-separated sportsbook or bookmaker filter
          schema:
            type: string

        - in: query
          name: commenceTimeFrom
          required: false
          schema:
            type: string

        - in: query
          name: commenceTimeTo
          required: false
          schema:
            type: string

        - in: query
          name: eventIds
          required: false
          schema:
            type: string

      responses:
        "200":
          description: Current odds board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"

        "502":
          description: All available upstream odds providers failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/odds/{sport}/scores:
    get:
      operationId: getOddsScores
      summary: Get live, upcoming, and recent scores
      parameters:
        - in: path
          name: sport
          required: true
          schema:
            type: string

        - in: query
          name: provider
          required: false
          schema:
            type: string
            enum:
              - sportsGameOdds
              - parlayApi
              - theOddsApi
              - oddsApiIo

        - in: query
          name: daysFrom
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 3

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix
            default: iso

      responses:
        "200":
          description: Scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"

        "502":
          description: All available upstream providers failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/odds/{sport}/events:
    get:
      operationId: getOddsEvents
      summary: Get the event list for a sport
      description: >
        Returned events may contain gateway_event_id and provider_event_id,
        which can be used for event-specific odds requests.
      parameters:
        - in: path
          name: sport
          required: true
          schema:
            type: string

        - in: query
          name: provider
          required: false
          schema:
            type: string
            enum:
              - sportsGameOdds
              - parlayApi
              - theOddsApi
              - oddsApiIo

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix
            default: iso

        - in: query
          name: commenceTimeFrom
          required: false
          schema:
            type: string

        - in: query
          name: commenceTimeTo
          required: false
          schema:
            type: string

      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"

        "502":
          description: All available upstream providers failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
                


  /v1/odds/clv/history:
    post:
      operationId: gradeClvHistory
      summary: Grade historical CLV for a wager using ParlayAPI
      description: >
        Sends a historical wager description to ParlayAPI's CLV grader.
        This endpoint is intended for post-bet closing-line analysis and
        does not consume the primary SportsGameOdds live-odds workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type:
                    - string
                    - "null"
                  description: >
                    ParlayAPI event identifier when known.

                sport_key:
                  type:
                    - string
                    - "null"
                  description: >
                    Normalized sport key such as americanfootball_nfl,
                    basketball_nba, basketball_ncaab,
                    americanfootball_ncaaf, baseball_mlb, or icehockey_nhl.

                market:
                  type:
                    - string
                    - "null"
                  description: >
                    Normalized market key such as h2h, spreads, totals,
                    or a supported player-prop market.

                line:
                  type:
                    - string
                    - number
                    - "null"
                  description: >
                    Wager line or point when applicable.

                outcome:
                  type:
                    - string
                    - "null"
                  description: >
                    Team, player, side, over/under, or other wager outcome.

                taken_odds:
                  type:
                    - string
                    - number
                    - "null"
                  description: >
                    Price taken on the original wager.

                bookmaker:
                  type:
                    - string
                    - "null"
                  description: >
                    Sportsbook or bookmaker for the original wager when known.

                home_team:
                  type:
                    - string
                    - "null"

                away_team:
                  type:
                    - string
                    - "null"

                game_date:
                  type:
                    - string
                    - "null"
                  description: >
                    Event date used to match historical closing data.
                  format: date

              additionalProperties: true

      responses:
        "200":
          description: Historical CLV grading result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"

        "400":
          description: Invalid CLV grading request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "502":
          description: ParlayAPI CLV grading request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/odds/{sport}/closing-odds:
    get:
      operationId: getClosingOdds
      summary: Get historical closing odds from ParlayAPI
      description: >
        Retrieves final pregame closing prices for CLV analysis.
        This endpoint intentionally uses ParlayAPI so closing-line
        lookups do not consume the primary SportsGameOdds workflow.
      parameters:
        - in: path
          name: sport
          required: true
          description: >
            Normalized sport key such as americanfootball_nfl,
            basketball_nba, basketball_ncaab, americanfootball_ncaaf,
            baseball_mlb, or icehockey_nhl.
          schema:
            type: string

        - in: query
          name: date
          required: false
          description: Closing-line date in YYYY-MM-DD format
          schema:
            type: string
            format: date

        - in: query
          name: event_id
          required: false
          description: >
            ParlayAPI event identifier used to restrict the closing-line
            response to a single event.
          schema:
            type: string

        - in: query
          name: markets
          required: false
          description: >
            Comma-separated markets such as h2h, spreads, totals,
            or other closing markets supported by ParlayAPI.
          schema:
            type: string

        - in: query
          name: bookmakers
          required: false
          description: >
            Optional comma-separated sportsbook or bookmaker filter.
          schema:
            type: string

      responses:
        "200":
          description: Historical closing odds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "502":
          description: ParlayAPI closing-line request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
                
  /v1/odds/{sport}/events/{eventId}/odds:
    get:
      operationId: getOddsForEvent
      summary: Get odds for a specific event
      description: >
        Use this for event-specific markets, props, alternate markets,
        and other markets supported by the selected provider.
      parameters:
        - in: path
          name: sport
          required: true
          schema:
            type: string

        - in: path
          name: eventId
          required: true
          description: Provider event ID or gateway_event_id
          schema:
            type: string

        - in: query
          name: provider
          required: false
          schema:
            type: string
            enum:
              - sportsGameOdds
              - parlayApi
              - theOddsApi
              - oddsApiIo

        - in: query
          name: regions
          required: false
          schema:
            type: string
            default: us

        - in: query
          name: markets
          required: true
          description: >
            Market or comma-separated markets such as h2h, spreads,
            totals, player props, or alternate lines.
          schema:
            type: string

        - in: query
          name: oddsFormat
          required: false
          schema:
            type: string
            enum:
              - american
              - decimal
            default: american

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix
            default: iso

        - in: query
          name: bookmakers
          required: false
          schema:
            type: string

      responses:
        "200":
          description: Event-specific odds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"

        "502":
          description: Upstream odds provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/logs/bet-log:
    get:
      operationId: listBetLogEntries
      summary: List saved betting log entries
      description: >
        Returns saved betting log entries with pagination and optional
        filters. Use limit and offset to safely retrieve large betting
        histories in chunks.
      parameters:
        - in: query
          name: limit
          required: false
          description: Maximum number of betting log entries to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50

        - in: query
          name: offset
          required: false
          description: Number of betting log entries to skip
          schema:
            type: integer
            minimum: 0
            default: 0

        - in: query
          name: start_date
          required: false
          description: Only return bets on or after this date
          schema:
            type: string
            format: date

        - in: query
          name: end_date
          required: false
          description: Only return bets on or before this date
          schema:
            type: string
            format: date

        - in: query
          name: sport
          required: false
          description: Filter betting log entries by sport
          schema:
            type: string

        - in: query
          name: result
          required: false
          description: >
            Filter by bet result, such as win, loss, push, pending,
            void, or cashout.
          schema:
            type: string

      responses:
        "200":
          description: Saved betting log
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BetLogEntry"

                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      returned:
                        type: integer
                    additionalProperties: true

                additionalProperties: true

    post:
      operationId: createBetLogEntry
      summary: Save a new betting log entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetLogEntryInput"

      responses:
        "201":
          description: Saved betting log entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BetLogEntry"
                additionalProperties: true

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/logs/bet-log/{id}:
    patch:
      operationId: updateBetLogEntry
      summary: Update a saved betting log entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetLogEntryUpdate"

      responses:
        "200":
          description: Updated betting log entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/BetLogEntry"
                additionalProperties: true

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Betting log entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteBetLogEntry
      summary: Delete a saved betting log entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      responses:
        "200":
          description: Deleted betting log entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted_id:
                    type: string
                additionalProperties: true

        "404":
          description: Betting log entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/logs/postmortems:
    get:
      operationId: listPostmortems
      summary: List saved betting postmortems
      responses:
        "200":
          description: Saved betting postmortems
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PostmortemEntry"
                additionalProperties: true

    post:
      operationId: createPostmortem
      summary: Save a betting postmortem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostmortemEntryInput"

      responses:
        "201":
          description: Saved betting postmortem
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PostmortemEntry"
                additionalProperties: true

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/logs/postmortems/{id}:
    patch:
      operationId: updatePostmortem
      summary: Update a saved betting postmortem
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostmortemEntryUpdate"

      responses:
        "200":
          description: Updated betting postmortem
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/PostmortemEntry"
                additionalProperties: true

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Postmortem not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deletePostmortem
      summary: Delete a saved betting postmortem
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      responses:
        "200":
          description: Deleted betting postmortem
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted_id:
                    type: string
                additionalProperties: true

        "404":
          description: Postmortem not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:

  schemas:

    League:
      type: object
      properties:
        code:
          type: string
          enum:
            - NBA
            - NFL
            - NCAAM
            - NCAAF
            - MLB
            - NHL

        name:
          type: string

        season_type:
          type: string

        notes:
          type: string

      required:
        - code
        - name

      additionalProperties: true

    GatewayResponse:
      type: object
      properties:
        provider:
          type: string

        data:
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                additionalProperties: true

            - type: object
              properties:
                id:
                  type: string
              additionalProperties: true

            - type: "null"

        quota:
          oneOf:
            - type: object
              properties:
                remaining:
                  type:
                    - string
                    - number
                    - "null"

                used:
                  type:
                    - string
                    - number
                    - "null"

                last:
                  type:
                    - string
                    - number
                    - "null"

              additionalProperties: true

            - type: "null"

        cache:
          type: object
          properties:
            hit:
              type: boolean
          additionalProperties: true

      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string

            status:
              type:
                - integer
                - "null"

            details:
              oneOf:
                - type: object
                  properties:
                    message:
                      type: string
                  additionalProperties: true

                - type: "null"

          required:
            - message

          additionalProperties: true

      required:
        - error

      additionalProperties: true

    BetLogEntryInput:
      type: object
      properties:
        date:
          type: string

        sport:
          type: string

        league:
          type: string

        event:
          type: string

        market:
          type: string

        selection:
          type: string

        line:
          type:
            - string
            - number
            - "null"

        odds:
          type: string

        sportsbook:
          type: string

        gateway_event_id:
          type:
            - string
            - "null"
          description: >
            Stable SharpBet gateway event identifier used to re-query
            the same event for CLV and market tracking.

        provider_event_id:
          type:
            - string
            - "null"
          description: >
            Native upstream odds-provider event identifier when available.

        sport_key:
          type:
            - string
            - "null"
          description: >
            Normalized odds sport key such as americanfootball_nfl,
            basketball_nba, baseball_mlb, or icehockey_nhl.

        market_key:
          type:
            - string
            - "null"
          description: >
            Normalized odds-market key such as h2h, spreads, totals,
            player_points, or other provider-supported market.

        outcome_key:
          type:
            - string
            - "null"
          description: >
            Normalized identifier for the exact team, player, side,
            over/under, or market outcome being wagered.

        bookmaker_key:
          type:
            - string
            - "null"
          description: >
            Normalized sportsbook or bookmaker identifier when available.

        odds_provider:
          type:
            - string
            - "null"
          description: >
            Odds provider that supplied the original market or event data.

        commence_time:
          type:
            - string
            - "null"
          format: date-time
          description: >
            Scheduled event start time used for close-price timing and matching.

        stake_usd:
          type:
            - number
            - "null"

        units:
          type:
            - number
            - "null"

        is_bonus_bet:
          type: boolean

        boost_used:
          type: boolean

        ev_percent:
          type:
            - number
            - "null"

        fair_odds:
          type:
            - string
            - number
            - "null"

        kelly_percent:
          type:
            - number
            - "null"

        reason:
          type:
            - string
            - "null"

        confidence:
          type:
            - string
            - "null"
          description: >
            SharpBet confidence label such as STRONG, SOLID,
            SMALL EDGE, AGGRESSIVE VALUE, or PASS.

        primary_script:
          type:
            - string
            - "null"
          description: Primary expected game script supporting the wager.

        failure_script:
          type:
            - string
            - "null"
          description: >
            Main scenario in which the handicap or market selection can fail.

        supporting_evidence:
          type:
            - string
            - "null"
          description: Strongest evidence supporting the handicap.

        contradicting_evidence:
          type:
            - string
            - "null"
          description: Strongest evidence arguing against the handicap.

        market_reason:
          type:
            - string
            - "null"
          description: >
            Why this market was selected as the best expression
            of the handicap.

        handicap_tags:
          oneOf:
            - type: array
              items:
                type: string

            - type: "null"

          description: >
            Structured tags describing the main handicapping mechanisms.

        result:
          type:
            - string
            - "null"

        payout_usd:
          type:
            - number
            - "null"

        closing_line:
          type:
            - string
            - number
            - "null"

        closing_odds:
          type:
            - string
            - "null"

        closing_book:
          type:
            - string
            - "null"

        clv_percent:
          type:
            - number
            - "null"

        clv_status:
          type:
            - string
            - "null"

        clv_notes:
          type:
            - string
            - "null"

        postmortem:
          type:
            - string
            - "null"

      required:
        - date
        - sport
        - league
        - event
        - market
        - selection
        - odds
        - sportsbook

      additionalProperties: false

    BetLogEntryUpdate:
      type: object
      properties:
        gateway_event_id:
          type:
            - string
            - "null"

        provider_event_id:
          type:
            - string
            - "null"

        sport_key:
          type:
            - string
            - "null"

        market_key:
          type:
            - string
            - "null"

        outcome_key:
          type:
            - string
            - "null"

        bookmaker_key:
          type:
            - string
            - "null"

        odds_provider:
          type:
            - string
            - "null"

        commence_time:
          type:
            - string
            - "null"
          format: date-time

        closing_line:
          type:
            - string
            - number
            - "null"

        closing_odds:
          type:
            - string
            - "null"

        closing_book:
          type:
            - string
            - "null"

        clv_percent:
          type:
            - number
            - "null"

        clv_status:
          type:
            - string
            - "null"

        clv_notes:
          type:
            - string
            - "null"

        result:
          type:
            - string
            - "null"

        payout_usd:
          type:
            - number
            - "null"

        postmortem:
          type:
            - string
            - "null"

        ev_percent:
          type:
            - number
            - "null"

        fair_odds:
          type:
            - string
            - number
            - "null"

        kelly_percent:
          type:
            - number
            - "null"

        reason:
          type:
            - string
            - "null"

      additionalProperties: false

    BetLogEntry:
      allOf:
        - $ref: "#/components/schemas/BetLogEntryInput"

        - type: object
          properties:
            id:
              type: string

            created_at:
              type: string

          required:
            - id
            - created_at

          additionalProperties: true

    PostmortemEntryInput:
      type: object
      properties:
        date:
          type: string

        summary:
          type: string

        best_decisions:
          type: array
          items:
            type: string

        worst_decisions:
          type: array
          items:
            type: string

        process_notes:
          type: array
          items:
            type: string

        adjustments:
          type: array
          items:
            type: string

      required:
        - date
        - summary

      additionalProperties: false

    PostmortemEntryUpdate:
      type: object
      properties:
        date:
          type: string

        summary:
          type: string

        best_decisions:
          type: array
          items:
            type: string

        worst_decisions:
          type: array
          items:
            type: string

        process_notes:
          type: array
          items:
            type: string

        adjustments:
          type: array
          items:
            type: string

      additionalProperties: false

    PostmortemEntry:
      allOf:
        - $ref: "#/components/schemas/PostmortemEntryInput"

        - type: object
          properties:
            id:
              type: string

            created_at:
              type: string

          required:
            - id
            - created_at

          additionalProperties: true
