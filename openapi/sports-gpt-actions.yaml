openapi: 3.0.3

info:
  title: SharpBet Sports GPT Gateway
  version: 2.1.0
  description: >
    Unified SharpBet sports data gateway for NBA, NFL, NCAAM, NCAAF, MLB,
    and NHL. Includes odds, scores, events, event-specific odds, provider
    fallback status, persistent provider usage history, betting logs,
    and postmortems.

servers:
  - url: https://sports-gpt-gateway.onrender.com
    description: SharpBet Sports GPT Gateway on Render

tags:
  - name: System
  - name: Sports
  - name: Odds
  - name: Betting Logs

paths:

  /health:
    get:
      operationId: healthCheck
      tags:
        - System
      summary: Check gateway health and provider configuration
      responses:
        '200':
          description: Gateway health
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/leagues:
    get:
      operationId: listLeagues
      tags:
        - Sports
      summary: List supported sports leagues
      responses:
        '200':
          description: Supported leagues
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/League'

  /v1/games:
    get:
      operationId: listGames
      tags:
        - Sports
      summary: List games for a league
      parameters:
        - in: query
          name: league
          required: true
          schema:
            $ref: '#/components/schemas/LeagueCode'

        - in: query
          name: date
          required: false
          description: Game date in YYYY-MM-DD format
          schema:
            type: string
            format: date

        - in: query
          name: season
          required: false
          schema:
            type: integer

        - in: query
          name: week
          required: false
          description: Primarily used for NFL and NCAAF
          schema:
            type: integer

        - in: query
          name: team
          required: false
          description: Team abbreviation, name, or provider team ID
          schema:
            type: string

        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - scheduled
              - live
              - final
              - postponed

        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25

        - in: query
          name: cursor
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Games
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/games/{league}/{gameId}:
    get:
      operationId: getGame
      tags:
        - Sports
      summary: Get a specific game
      parameters:
        - in: path
          name: league
          required: true
          schema:
            $ref: '#/components/schemas/LeagueCode'

        - in: path
          name: gameId
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Game detail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'

  /v1/teams:
    get:
      operationId: listTeams
      tags:
        - Sports
      summary: List teams for a league
      parameters:
        - in: query
          name: league
          required: true
          schema:
            $ref: '#/components/schemas/LeagueCode'

        - in: query
          name: search
          required: false
          description: Team name, city, college, or abbreviation
          schema:
            type: string

        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50

      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/standings:
    get:
      operationId: listStandings
      tags:
        - Sports
      summary: Get standings for a league and season
      parameters:
        - in: query
          name: league
          required: true
          schema:
            $ref: '#/components/schemas/LeagueCode'

        - in: query
          name: season
          required: false
          schema:
            type: integer

        - in: query
          name: conference
          required: false
          schema:
            type: string

        - in: query
          name: division
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Standings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/odds/status:
    get:
      operationId: getOddsProviderStatus
      tags:
        - Odds
      summary: Get odds provider runtime status and persistent usage history
      description: >
        Returns current runtime status plus persistent Supabase usage history
        for SportsGameOdds, ParlayAPI, The Odds API, and any other configured
        providers. Includes request counts, successes, failures, fallbacks,
        cache information, last success, last error, and quota information.
      responses:
        '200':
          description: Odds provider status and history
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime:
                    type: object
                    additionalProperties: true
                  history:
                    type: object
                    additionalProperties: true
                additionalProperties: true

  /v1/odds/sports:
    get:
      operationId: listOddsSports
      tags:
        - Odds
      summary: List sports supported by the odds gateway
      description: >
        Uses the gateway's configured sports-provider order. The backend
        handles provider selection and fallback.
      parameters:
        - $ref: '#/components/parameters/OddsProvider'

      responses:
        '200':
          description: Supported sports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleOddsResponse'

  /v1/odds/{sport}/odds:
    get:
      operationId: getOddsBoard
      tags:
        - Odds
      summary: Get the odds board for a sport
      description: >
        Uses SharpBet's gateway provider chain. By default the backend tries
        SportsGameOdds first, then ParlayAPI, then The Odds API when available.
        A provider can optionally be specified for direct testing.
      parameters:
        - $ref: '#/components/parameters/SportPath'

        - $ref: '#/components/parameters/OddsProvider'

        - in: query
          name: regions
          required: false
          description: Sportsbook region when supported by the selected provider
          schema:
            type: string

        - in: query
          name: markets
          required: false
          description: >
            Comma-separated markets such as h2h, spreads, totals, props,
            alternates, or other provider-supported markets
          schema:
            type: string

        - in: query
          name: oddsFormat
          required: false
          schema:
            type: string
            enum:
              - american
              - decimal

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix

        - in: query
          name: bookmakers
          required: false
          description: Comma-separated sportsbook or bookmaker filter
          schema:
            type: string

        - in: query
          name: commenceTimeFrom
          required: false
          schema:
            type: string

        - in: query
          name: commenceTimeTo
          required: false
          schema:
            type: string

        - in: query
          name: eventIds
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Current odds board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleOddsResponse'

        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /v1/odds/{sport}/scores:
    get:
      operationId: getOddsScores
      tags:
        - Odds
      summary: Get live, recent, or upcoming scores for a sport
      parameters:
        - $ref: '#/components/parameters/SportPath'

        - $ref: '#/components/parameters/OddsProvider'

        - in: query
          name: daysFrom
          required: false
          description: Number of days of score history when supported
          schema:
            type: integer
            minimum: 1
            maximum: 3

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix

      responses:
        '200':
          description: Scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleOddsResponse'

        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /v1/odds/{sport}/events:
    get:
      operationId: getOddsEvents
      tags:
        - Odds
      summary: Get events for a sport
      description: >
        Returns events from the gateway and may include gateway_event_id and
        provider_event_id fields for later event-specific odds calls.
      parameters:
        - $ref: '#/components/parameters/SportPath'

        - $ref: '#/components/parameters/OddsProvider'

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix

        - in: query
          name: commenceTimeFrom
          required: false
          schema:
            type: string

        - in: query
          name: commenceTimeTo
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleOddsResponse'

        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /v1/odds/{sport}/events/{eventId}/odds:
    get:
      operationId: getOddsForEvent
      tags:
        - Odds
      summary: Get odds for a single event
      description: >
        Retrieves event-specific odds including props, alternate markets,
        or other supported markets. Gateway event IDs are provider-aware.
      parameters:
        - $ref: '#/components/parameters/SportPath'

        - in: path
          name: eventId
          required: true
          description: Provider event ID or gateway_event_id
          schema:
            type: string

        - $ref: '#/components/parameters/OddsProvider'

        - in: query
          name: regions
          required: false
          schema:
            type: string

        - in: query
          name: markets
          required: true
          description: >
            Market or comma-separated markets to request, such as h2h,
            spreads, totals, player props, alternate lines, or other
            provider-supported event markets
          schema:
            type: string

        - in: query
          name: oddsFormat
          required: false
          schema:
            type: string
            enum:
              - american
              - decimal

        - in: query
          name: dateFormat
          required: false
          schema:
            type: string
            enum:
              - iso
              - unix

        - in: query
          name: bookmakers
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Event-specific odds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleOddsResponse'

        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /v1/logs/bet-log:
    get:
      operationId: listBetLogEntries
      tags:
        - Betting Logs
      summary: Get saved SharpBet betting log entries
      description: >
        Returns betting log entries with pagination and optional filters.
        Use limit and offset to retrieve large histories in chunks.
      parameters:
        - in: query
          name: limit
          required: false
          description: Maximum number of entries to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50

        - in: query
          name: offset
          required: false
          description: Number of entries to skip before returning results
          schema:
            type: integer
            minimum: 0
            default: 0

        - in: query
          name: start_date
          required: false
          description: Only return bets on or after this date
          schema:
            type: string
            format: date

        - in: query
          name: end_date
          required: false
          description: Only return bets on or before this date
          schema:
            type: string
            format: date

        - in: query
          name: sport
          required: false
          description: Filter by sport
          schema:
            type: string

        - in: query
          name: result
          required: false
          description: Filter by result, such as win, loss, push, or pending
          schema:
            type: string

      responses:
        '200':
          description: Betting log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BetLogEntry'

                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      returned:
                        type: integer

    post:
      operationId: createBetLogEntry
      tags:
        - Betting Logs
      summary: Save a SharpBet betting log entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BetLogEntryInput'

      responses:
        '201':
          description: Betting log entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BetLogEntry'

        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/logs/bet-log/{id}:
    patch:
      operationId: updateBetLogEntry
      tags:
        - Betting Logs
      summary: Update a saved betting log entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BetLogEntryUpdate'

      responses:
        '200':
          description: Betting log entry updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BetLogEntry'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteBetLogEntry
      tags:
        - Betting Logs
      summary: Delete a saved betting log entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Betting log entry deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted_id:
                    type: string

        '404':
          $ref: '#/components/responses/NotFound'

  /v1/logs/postmortems:
    get:
      operationId: listPostmortems
      tags:
        - Betting Logs
      summary: Get saved SharpBet betting postmortems
      responses:
        '200':
          description: Betting postmortems
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostmortemEntry'

    post:
      operationId: createPostmortem
      tags:
        - Betting Logs
      summary: Save a SharpBet betting postmortem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostmortemEntryInput'

      responses:
        '201':
          description: Betting postmortem created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PostmortemEntry'

        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/logs/postmortems/{id}:
    patch:
      operationId: updatePostmortem
      tags:
        - Betting Logs
      summary: Update a saved betting postmortem
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostmortemEntryUpdate'

      responses:
        '200':
          description: Betting postmortem updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/PostmortemEntry'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deletePostmortem
      tags:
        - Betting Logs
      summary: Delete a saved betting postmortem
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Betting postmortem deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted_id:
                    type: string

        '404':
          $ref: '#/components/responses/NotFound'

components:

  parameters:

    SportPath:
      in: path
      name: sport
      required: true
      description: >
        Odds gateway sport key, for example basketball_nba,
        americanfootball_nfl, baseball_mlb, icehockey_nhl,
        basketball_ncaab, or americanfootball_ncaaf.
      schema:
        type: string

    OddsProvider:
      in: query
      name: provider
      required: false
      description: >
        Optional direct provider override. Leave blank for the normal
        SharpBet fallback chain.
      schema:
        type: string
        enum:
          - sportsGameOdds
          - parlayApi
          - theOddsApi
          - oddsApiIo

  responses:

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UpstreamFailure:
      description: One or more upstream sports or odds providers failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    LeagueCode:
      type: string
      enum:
        - NBA
        - NFL
        - NCAAM
        - NCAAF
        - MLB
        - NHL

    League:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/LeagueCode'
        name:
          type: string
        season_type:
          type: string
        notes:
          type: string
      required:
        - code
        - name

    FlexibleOddsResponse:
      type: object
      description: >
        Flexible provider-normalized odds gateway response. The exact data
        payload may differ by provider and market.
      properties:
        provider:
          type: string

        data:
          description: Provider response data
          nullable: true

        quota:
          type: object
          nullable: true
          additionalProperties: true

        cache:
          type: object
          properties:
            hit:
              type: boolean
          additionalProperties: true

      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            status:
              type: integer
            details:
              nullable: true
          required:
            - message
      required:
        - error

    BetLogEntryInput:
      type: object
      properties:
        date:
          type: string

        sport:
          type: string

        league:
          type: string

        event:
          type: string

        market:
          type: string

        selection:
          type: string

        line:
          nullable: true

        odds:
          type: string

        sportsbook:
          type: string

        stake_usd:
          type: number
          nullable: true

        units:
          type: number
          nullable: true

        is_bonus_bet:
          type: boolean

        boost_used:
          type: boolean

        ev_percent:
          type: number
          nullable: true

        fair_odds:
          nullable: true

        kelly_percent:
          type: number
          nullable: true

        reason:
          type: string
          nullable: true

        confidence:
          type: string
          nullable: true
          description: >
            SharpBet confidence label such as STRONG, SOLID,
            SMALL EDGE, AGGRESSIVE VALUE, or PASS.

        primary_script:
          type: string
          nullable: true
          description: >
            Primary expected game script supporting the wager.

        failure_script:
          type: string
          nullable: true
          description: >
            Main scenario in which the handicap or market selection can fail.

        supporting_evidence:
          type: string
          nullable: true
          description: >
            Strongest evidence supporting the handicap.

        contradicting_evidence:
          type: string
          nullable: true
          description: >
            Strongest evidence arguing against the handicap.

        market_reason:
          type: string
          nullable: true
          description: >
            Why this market was selected as the best expression of the handicap.

        handicap_tags:
          type: array
          nullable: true
          description: >
            Structured tags describing the main handicapping mechanisms.
          items:
            type: string

        result:
          type: string
          nullable: true

        payout_usd:
          type: number
          nullable: true

        closing_line:
          nullable: true

        clv_notes:
          type: string
          nullable: true

        postmortem:
          type: string
          nullable: true

      required:
        - date
        - sport
        - league
        - event
        - market
        - selection
        - odds
        - sportsbook

    BetLogEntryUpdate:
      type: object
      properties:
        closing_line:
          nullable: true

        clv_notes:
          type: string
          nullable: true

        result:
          type: string
          nullable: true

        payout_usd:
          type: number
          nullable: true

        postmortem:
          type: string
          nullable: true

        ev_percent:
          type: number
          nullable: true

        fair_odds:
          nullable: true

        kelly_percent:
          type: number
          nullable: true

        reason:
          type: string
          nullable: true

    BetLogEntry:
      allOf:
        - $ref: '#/components/schemas/BetLogEntryInput'
        - type: object
          properties:
            id:
              type: string

            created_at:
              type: string
              format: date-time

          required:
            - id
            - created_at

    PostmortemEntryInput:
      type: object
      properties:
        date:
          type: string

        summary:
          type: string

        best_decisions:
          type: array
          items:
            type: string

        worst_decisions:
          type: array
          items:
            type: string

        process_notes:
          type: array
          items:
            type: string

        adjustments:
          type: array
          items:
            type: string

      required:
        - date
        - summary

    PostmortemEntryUpdate:
      type: object
      properties:
        date:
          type: string

        summary:
          type: string

        best_decisions:
          type: array
          items:
            type: string

        worst_decisions:
          type: array
          items:
            type: string

        process_notes:
          type: array
          items:
            type: string

        adjustments:
          type: array
          items:
            type: string

    PostmortemEntry:
      allOf:
        - $ref: '#/components/schemas/PostmortemEntryInput'
        - type: object
          properties:
            id:
              type: string

            created_at:
              type: string
              format: date-time

          required:
            - id
            - created_at
