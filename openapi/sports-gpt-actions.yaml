  /v1/logs/promos:
    get:
      operationId: listPromos
      summary: List saved promos
      description: Returns saved promo inventory with optional status, sportsbook, type, expiration, and
        pagination filters.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      - name: status
        in: query
        schema:
          type: string
          enum:
          - NEW
          - AVAILABLE
          - USED
          - EXPIRED
          - VOID
      - name: sportsbook
        in: query
        schema:
          type: string
      - name: promo_type
        in: query
        schema:
          type: string
      - name: expires_before
        in: query
        schema:
          type: string
      - name: expires_after
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Promo inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: &id001
                      $ref: '#/components/schemas/PromoEntry'
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      returned:
                        type: integer
                    required:
                    - limit
                    - offset
                    - returned
                required:
                - data
                - pagination
    post:
      operationId: createPromo
      summary: Save a new promo
      description: Adds a sportsbook boost, bonus bet, or other promotion to the persistent promo inventory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoEntryInput'
      responses:
        '201':
          description: Promo created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: *id001
                required:
                - data
  /v1/logs/promos/{id}:
    patch:
      operationId: updatePromo
      summary: Update a saved promo
      description: Updates promo terms, expiration, notes, or status such as AVAILABLE, USED, EXPIRED,
        or VOID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoEntryUpdate'
      responses:
        '200':
          description: Promo updated
          content:
